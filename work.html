<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Work | Lew2Visuals</title>
  <meta name="description" content="Selected films by Lew2Visuals: event recaps, brand content, streetwear campaigns and music visuals.">
  <meta name="theme-color" content="#0d0d0d">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="work" data-seq="SEQ_WORK">
  <a class="sr-only" href="#main">Skip to content</a>
  <main id="main">
    <section class="pagehead wrap theme-light" data-clip="W00_BIN">
      <div class="slug mono"><span class="slug__v">V1</span><span class="slug__sq"></span><span class="mono--dim">W00_BIN / Project bin</span><span class="slug__right mono--dim" data-work-count></span></div>
      <h1 class="display display--xl" data-split>Work</h1>
      <div class="pagehead__row" style="margin-top:clamp(28px,4vw,48px)">
        <p class="lede" style="margin:0" data-reveal>Events, brands, streetwear and music. Hover a clip to roll it, click to open the cut.</p>
      </div>
    </section>

    <section class="wrap theme-light" data-clip="W01_CLIPS" style="padding-bottom:clamp(80px,10vw,160px)">
      <div class="filters" role="toolbar" aria-label="Filter work" style="margin-bottom:36px">
        <div class="filters" data-filters></div>
        <div class="viewtoggle" role="group" aria-label="View">
          <button class="chip" data-view="grid" aria-pressed="true">Grid</button>
          <button class="chip" data-view="index" aria-pressed="false">Index</button>
        </div>
      </div>
      <div data-work>
        <div class="grid" data-grid></div>
        <div class="index" data-index role="list"></div>
      </div>
      <div class="peek" data-peek aria-hidden="true"><video muted loop playsinline preload="none"></video></div>
    </section>

    <section class="section wrap cta" data-clip="W02_CTA">
      <div class="slug mono"><span class="slug__v">V1</span><span class="slug__sq"></span><span class="mono--dim">W02_CTA / Render queue</span><span class="slug__right mono--dim"><span class="dot dot--live" style="width:6px;height:6px"></span> <span data-booking></span></span></div>
      <h2 class="display cta__title" data-split>Your clip<br><span class="grey">goes</span> here.</h2>
      <div class="cta__actions">
        <a class="btn" href="contact.html" data-magnetic><span class="dot"></span>Start a project</a>
        <a class="link-u mono" href="mailto:" data-email></a>
      </div>
    </section>
  </main>
  <div data-footer></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/dots.js"></script>
  <script src="assets/js/pages/work.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
